name: Deploy React + Node App to Render

on:
  push:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      # Server
      - name: Install server deps
        run: cd server && npm install

      # Client
      - name: Install client deps
        run: cd client && npm install

      - name: Build client
        run: cd client && npm run build && npm run dev

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Server Deploy
        run: curl -X POST ${{ secrets.RENDER_SERVER_HOOK }}

      - name: Trigger Client Deploy
        run: curl -X POST ${{ secrets.RENDER_CLIENT_HOOK }}
