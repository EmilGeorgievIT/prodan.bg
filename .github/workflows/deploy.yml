name: Deploy React + Node App to Render

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # --------------------------
      # Install server dependencies
      # --------------------------
      - name: Install server
        run: |
          cd server
          npm install

      # --------------------------
      # Install + build client
      # --------------------------
      - name: Install client
        run: |
          cd client
          npm install

      - name: Build client
        run: |
          cd client
          npm run build

      # --------------------------
      # Deploy to Render services
      # --------------------------
      - name: Deploy Server to Render
        run: curl -X POST ${{ secrets.RENDER_SERVER_HOOK }}

      - name: Deploy Client to Render
        run: curl -X POST ${{ secrets.RENDER_CLIENT_HOOK }}
